name: Build and test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - run: npm ci
      - run: npm test
      - name: Publish
        run: dotnet publish -c Release -o "$RUNNER_TEMP/mycontractor-publish"
      - name: Smoke-test the published app
        run: bash scripts/smoke-test.sh "$RUNNER_TEMP/mycontractor-publish"
